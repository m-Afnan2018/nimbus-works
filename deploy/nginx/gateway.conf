# In-stack gateway (nginx container). One origin per app, so cookies, CORS and
# websockets need no special handling:
#   :8080  Workspace UI (static files) + /api, /uploads, /socket.io -> Workspace API
#   :8081  Finance UI (static files) + /api -> Finance API
#
# Dynamic routes: the static export prerenders each one once with the
# placeholder id "_" (e.g. /projects/_.html); every real id is served that
# page and the browser reads the id from the URL. Ids never contain dots, so
# `[^/.]+` keeps the Next client's /projects/<id>.txt fetches out of these
# rules (they 404 and Next falls back to a normal page load).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

server {
  listen 8080;
  root /srv/workspace;
  client_max_body_size 1m;   # uploads are disabled in the demo

  location /api/ {
    proxy_pass http://workspace-api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /uploads/ {
    proxy_pass http://workspace-api:5000;
  }

  location /socket.io/ {
    proxy_pass http://workspace-api:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  # Content-hashed build output: cache for a year.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # The service worker must always be re-checked.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location ~ ^/projects/[^/.]+/tasks/[^/.]+/?$ { try_files /projects/_/tasks/_.html =404; }
  location ~ ^/projects/[^/.]+/?$              { try_files /projects/_.html =404; }
  location ~ ^/sops/[^/.]+/?$                  { try_files /sops/_.html =404; }

  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }
  error_page 404 /404.html;
}

server {
  listen 8081;
  root /srv/finance;
  client_max_body_size 1m;

  location /api/ {
    proxy_pass http://finance-api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~ ^/invoices/[^/.]+/edit/?$  { try_files /invoices/_/edit.html =404; }
  location ~ ^/sops/[^/.]+/?$           { try_files /sops/_.html =404; }
  location ~ ^/services/[^/.]+/?$       { try_files /services/_.html =404; }
  location ~ ^/organizations/[^/.]+/?$  { try_files /organizations/_.html =404; }

  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }
  error_page 404 /404.html;
}
